<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Retro Station // Access</title>
    <style>
        body { background: #0c121c; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: #fff; font-family: sans-serif; }
        .gate-box { text-align: center; border: 1px solid #66c0f4; padding: 40px; border-radius: 8px; }
        input { padding: 12px; background: #1a2838; border: 1px solid #66c0f4; color: #fff; margin-bottom: 10px; width: 200px; }
        button { padding: 10px 20px; background: #66c0f4; border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
<div class="gate-box">
    <h2>SYSTEM_LOCKED</h2>
    <input type="password" id="pass-input" placeholder="Enter Access Code">
    <button onclick="checkAccess()">INITIALIZE</button>
</div>

<script>
    function checkAccess() {
        // Set your secret password here
        if (document.getElementById('pass-input').value === "Admin123") {
            window.location.href = "gallery.html";
        } else { alert("ACCESS_DENIED"); }
    }
</script>
</body>
</html>
