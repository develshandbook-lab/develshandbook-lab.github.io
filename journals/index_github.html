    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; text-align: center; padding-top: 50px; }

        .card { background: #1e1e1e; padding: 30px; border-radius: 10px; border: 1px solid #333; text-decoration: none; color: #fff; font-size: 1.2rem; transition: 0.2s; }
        .card:hover { background: #ff5722; transform: translateY(-5px); }
    </style>
</head>
<body>
    <h1>System Dashboard</h1>
    <hr style="width: 50px; border-color: #ff5722; margin-bottom: 40px;">

    <div class="grid">
        <a href="http://192.168.1.X:9999" target="_blank" class="card">
            <h3>Ugreen NAS</h3>
        </a>

        <a href="http://192.168.1.X:32400/web" target="_blank" class="card">
            <h3>Plex Media Server</h3>
        </a>
    </div>
</body>
