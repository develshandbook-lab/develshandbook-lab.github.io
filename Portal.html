<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Retro Station // Access Portal</title>
    <style>
        body { background: #0c121c; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { text-align: center; border: 1px solid #66c0f4; padding: 40px; border-radius: 8px; }
        input { padding: 10px; margin-bottom: 10px; display: block; background: #1a2838; border: 1px solid #66c0f4; color: #fff; }
        button { padding: 10px 20px; background: #66c0f4; border: none; cursor: pointer; }
    </style>
</head>
<body>
<div class="login-box">
    <h2>SYSTEM_ACCESS</h2>
    <input type="password" id="pass-input" placeholder="Access Code">
    <button onclick="portalAccess()">INITIALIZE</button>
</div>

<script>
    function portalAccess() {
        // Change "Admin123" to your secret password
        if (document.getElementById('pass-input').value === "Admin123") {
            window.location.href = "index.html"; // Redirects to your 2nd website
        } else { alert("ACCESS_DENIED"); }
    }
</script>
</body>
</html>
